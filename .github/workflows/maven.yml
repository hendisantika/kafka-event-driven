# Build & test every microservice with Maven on JDK 25.
# Integration tests use Testcontainers (PostgreSQL, MongoDB, Kafka), so Docker on the runner is required
# (available by default on GitHub-hosted ubuntu runners).
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        service: [ user-service, order-service ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build & test ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports
          retention-days: 7

  dependency-graph:
    # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts.
    # Only on push to main: PRs (especially from Dependabot) get a read-only token.
    name: Submit dependency graph ${{ matrix.service }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        service: [ user-service, order-service ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          directory: ${{ matrix.service }}
          # The action resolves the wrapper path relative to `directory` twice
          # (<service>/<service>/mvnw), so use the runner's Maven instead.
          ignore-maven-wrapper: true
          correlator: ${{ github.job }}-${{ matrix.service }}
