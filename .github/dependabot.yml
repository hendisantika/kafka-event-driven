# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # ---------------------------------------------------------------------------
  # Maven: user-service & order-service
  # Both services share the same stack, so related updates land in one PR.
  # ---------------------------------------------------------------------------
  - package-ecosystem: maven
    directories:
      - "/user-service"
      - "/order-service"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    assignees:
      - hendisantika
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      spring:
        patterns:
          - "org.springframework*"
      springdoc:
        patterns:
          - "org.springdoc*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      maven-plugins:
        patterns:
          - "org.apache.maven*"
          - "*maven-plugin"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Spring Boot major upgrades need a manual migration
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: [ "version-update:semver-major" ]

  # ---------------------------------------------------------------------------
  # GitHub Actions used in .github/workflows
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    assignees:
      - hendisantika
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Docker images used by local infrastructure (docker-compose*.yml)
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    assignees:
      - hendisantika
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-images:
        patterns:
          - "*"
    ignore:
      # Major upgrades of stateful services require data migration
      - dependency-name: "postgres"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "mongo"
        update-types: [ "version-update:semver-major" ]
